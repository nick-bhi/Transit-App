spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/transit
    username: transit
    password: transit
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    cors:
      allowed-origins: "http://localhost:5174"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
  management:
    endpoints:
      web:
        cors:
          allowed-origins: "http://localhost:5174"
          allowed-methods: "GET"

gtfs:
  staticZipUrl: "http://web.mta.info/developers/data/nyct/subway/google_transit.zip" 
  realtimeFeedUrl: "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs"

poll:
  intervalMs: 30000



